[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-separate-eval-mcp"
version = "0.1.1"
description = "MCP server for evaluating one patent feature-separation result"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.1,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
feature-separate-eval-mcp = "feature_separate_eval_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_separate_eval_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
